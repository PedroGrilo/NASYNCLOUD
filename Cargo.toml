[package]
name = "nasyncloud"
version = "1.2.1"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Files on demand para NAS com WebDAV (UGREEN UGOS e companhia): monta a NAS como pasta local, descarrega so o que abres e sincroniza as alteracoes."

# The desktop app (tray / menu bar) lives in desktop/. Plain `cargo build` and
# `cargo test` here still only build this package.
[workspace]
members = ["desktop"]

[features]
default = ["keyring"]
# Guarda a password no cofre do sistema (Credential Manager / Keychain / Secret Service).
keyring = ["dep:keyring"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
futures-util = "0.3"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
log = "0.4"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
roxmltree = "0.21"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1"
keyring = { version = "4", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
redb = "4"

# Linux (and other Unix): FUSE. The command line talks to the mount through xattrs.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
fuser = "0.18"
xattr = "1"

# macOS: a local NFS server mounted with the system's own NFS client (no macFUSE).
[target.'cfg(target_os = "macos")'.dependencies]
nfsserve = "0.11"

[target.'cfg(windows)'.dependencies]
cloud-filter = "0.0.7"

[dev-dependencies]
dav-server = { version = "0.12", default-features = false, features = ["localfs"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
