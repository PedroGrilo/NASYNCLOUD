[package]
name = "nasyncloud-desktop"
version = "1.3.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "NASYNCLOUD na bandeja / barra de menus: o painel e as janelas à volta do serviço nasyncloud."
publish = false

# Deliberately does not depend on the `nasyncloud` crate: the service is its own
# process, so this app keeps running (and can say so) when the service fails.
# It runs the `nasyncloud` binary next to it (`nasyncloud serve`) and shows its pages.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
