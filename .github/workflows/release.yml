name: Release

# Builds, after the tests:
# - macOS: the .dmg (first install) and NASYNCLOUD-macos-arm64.app.tar.gz + .sig
#   (what the in-app updater downloads);
# - Windows: the installer NASYNCLOUD-<version>-windows-x64-setup.exe + .sig.
# Pushing a tag v* (equal to the version in Cargo.toml, e.g. v1.0.0) publishes
# them in a GitHub Release together with latest.json, which the installed apps
# read to find updates. "Run workflow" by hand only builds them (run artifacts).
#
# Signing the updates needs the repository secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (see CLAUDE.md). Without them, manual runs
# build unsigned packages and tag runs fail.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI: "@tauri-apps/cli@2.12.4"

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml, signing key present
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "::error::the tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"; exit 1; }
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is missing: updates could not be verified"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Build NASYNCLOUD.app and the .dmg
        run: tools/package-macos.sh
      - name: Updater archive and its signature
        run: |
          # No AppleDouble (._*) entries: the updater cannot unpack them.
          COPYFILE_DISABLE=1 tar --no-mac-metadata -czf dist/NASYNCLOUD-macos-arm64.app.tar.gz -C dist NASYNCLOUD.app
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then npx --yes "$TAURI_CLI" signer sign dist/NASYNCLOUD-macos-arm64.app.tar.gz; fi
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/*.sig
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Build the service the installer bundles
        shell: bash
        run: |
          cargo build --release --locked -p nasyncloud
          mkdir -p desktop/binaries
          cp target/release/nasyncloud.exe desktop/binaries/nasyncloud-x86_64-pc-windows-msvc.exe
      - name: Build the installer (NSIS)
        shell: bash
        working-directory: desktop
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx --yes "$TAURI_CLI" build --bundles nsis
          else
            npx --yes "$TAURI_CLI" build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          setup=$(ls target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$setup" "dist/NASYNCLOUD-$version-windows-x64-setup.exe"
          if [ -f "$setup.sig" ]; then cp "$setup.sig" "dist/NASYNCLOUD-$version-windows-x64-setup.exe.sig"; fi
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: latest.json (read by the in-app updater)
        run: |
          python3 - <<'PY'
          import json, os, datetime
          tag = os.environ["GITHUB_REF_NAME"]; version = tag[1:]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          def entry(name):
              return {"signature": open(f"dist/{name}.sig").read().strip(), "url": f"{base}/{name}"}
          latest = {
              "version": version,
              "notes": f"NASYNCLOUD {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": entry("NASYNCLOUD-macos-arm64.app.tar.gz"),
                  "windows-x86_64": entry(f"NASYNCLOUD-{version}-windows-x64-setup.exe"),
              },
          }
          json.dump(latest, open("dist/latest.json", "w"), indent=2)
          PY
          head -5 dist/latest.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "NASYNCLOUD $GITHUB_REF_NAME" --generate-notes
