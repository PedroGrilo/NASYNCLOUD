<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nasdrive</title>
<style>
:root{
  --line:rgba(255,255,255,.09);--line-hi:rgba(255,255,255,.16);
  --text:#eceefe;--muted:#a1a7cc;--faint:#6e7499;
  --indigo:#818cf8;--indigo-2:#6366f1;--amber:#fbbf24;--green:#34d399;--red:#f87171;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;color:var(--text);background:transparent;overflow:hidden;-webkit-user-select:none;user-select:none}
/* Outside the desktop app (a normal browser tab), show it over a backdrop. */
body:not(.shell){background:radial-gradient(circle at 30% 20%,#1e1b4b,#080a16 70%);display:grid;place-items:center}
body:not(.shell) .panel{width:360px;height:560px}
.panel{height:100%;display:flex;flex-direction:column;background:rgba(14,16,32,.94);border:1px solid var(--line-hi);border-radius:14px;overflow:hidden;position:relative;
  box-shadow:0 18px 50px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.panel::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 60% at 0 0,rgba(99,102,241,.22),transparent 60%),radial-gradient(80% 50% at 100% 100%,rgba(245,158,11,.08),transparent 60%)}
.top{position:relative;display:flex;align-items:center;gap:10px;padding:14px 12px 12px 14px;border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;flex:none;border-radius:10px;background:linear-gradient(#818cf8,#4f46e5);display:grid;place-items:center;box-shadow:0 4px 14px rgba(99,102,241,.35)}
.logo i{display:block;width:18px;height:5px;border-radius:2px;background:#fff;position:relative;margin:1.5px 0}
.logo i::after{content:"";position:absolute;right:3px;top:1.5px;width:2px;height:2px;border-radius:50%;background:var(--amber)}
.logo i+i{opacity:.62}
.who{flex:1;min-width:0}
.who strong{display:block;font-size:14px;letter-spacing:.2px}
.who small{display:flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--faint)}
.dot.ok{background:var(--green)}.dot.busy{background:var(--indigo);animation:pulse 1.2s infinite}.dot.warn{background:var(--amber)}.dot.err{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;flex:none;border-radius:9px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.ib:hover{background:rgba(255,255,255,.08);color:var(--text)}
.ib:disabled{opacity:.3;cursor:default;background:none}
.ib.sm{width:28px;height:28px;opacity:0}
.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.menu{position:absolute;right:10px;top:50px;z-index:5;min-width:210px;padding:6px;border-radius:12px;background:#151831;border:1px solid var(--line-hi);box-shadow:0 14px 36px rgba(0,0,0,.5)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.menu button:hover{background:rgba(129,140,248,.16)}
.menu .ic svg{width:16px;height:16px}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.menu .danger{color:var(--red)}
.banner{position:relative;display:flex;gap:10px;align-items:flex-start;margin:10px 12px 0;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.35}
.banner.warn{background:rgba(245,158,11,.12);border:1px solid rgba(251,191,36,.28)}
.banner.err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3)}
.banner.info{background:rgba(129,140,248,.12);border:1px solid rgba(129,140,248,.3)}
.banner .ic{margin-top:1px}
.banner button{margin-top:6px;padding:5px 10px;border-radius:7px;border:0;background:var(--indigo-2);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.list{position:relative;flex:1;overflow-y:auto;padding:6px 6px 8px}
.list h3{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);padding:10px 10px 6px}
.item{display:flex;align-items:center;gap:11px;padding:8px 8px 8px 10px;border-radius:10px;cursor:default}
.item:hover{background:rgba(255,255,255,.05)}
.item:hover .ib.sm{opacity:1}
.fi{position:relative;width:34px;height:34px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:9.5px;font-weight:700;letter-spacing:.3px;color:#fff;background:#3b3f63}
.fi.img{background:#0f9f6e}.fi.vid{background:#7c3aed}.fi.aud{background:#d97706}.fi.doc{background:#4f46e5}.fi.zip{background:#b45309}.fi.code{background:#0e7490}
.fi .dir{position:absolute;right:-5px;bottom:-5px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:#0e1020;border:1.5px solid #0e1020}
.fi .dir .ic svg{width:13px;height:13px;stroke-width:2.4}
.fi .dir.up{color:var(--indigo)}.fi .dir.down{color:var(--green)}.fi .dir.err{color:var(--red)}
.meta{flex:1;min-width:0}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub.err{color:var(--red)}
.prog{height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}
.prog span{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--indigo-2),var(--indigo));transition:width .4s}
.prog.indet span{width:35%!important;animation:slide 1.1s infinite ease-in-out}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(290%)}}
.empty{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 34px;text-align:center;color:var(--muted)}
.empty .big{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:rgba(129,140,248,.12);color:var(--indigo)}
.empty .big svg{width:28px;height:28px}
.empty strong{color:var(--text);font-size:14px}
.foot{position:relative;display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);background:rgba(255,255,255,.02)}
.usage{flex:1;min-width:0}
.usage small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--indigo-2),var(--amber))}
.link{border:0;background:none;color:var(--indigo);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;padding:4px 2px}
.link:hover{color:#a5b4fc}
.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px;border:2px solid transparent;background-clip:padding-box}
</style>
</head>
<body>
<div class="panel">
  <header class="top">
    <div class="logo" aria-hidden="true"><i></i><i></i></div>
    <div class="who"><strong>nasdrive</strong><small><span class="dot" id="dot"></span><span id="status">A carregar…</span></small></div>
    <button class="ib" id="b-folder" type="button" title="Abrir a pasta da NAS" aria-label="Abrir a pasta da NAS"></button>
    <button class="ib" id="b-menu" type="button" title="Mais opções" aria-label="Mais opções" aria-haspopup="menu"></button>
    <div class="menu" id="menu" role="menu" hidden>
      <button type="button" role="menuitem" data-act="main" data-icon="ext">Abrir o nasdrive</button>
      <button type="button" role="menuitem" data-act="settings" data-icon="gear">Definições</button>
      <button type="button" role="menuitem" data-act="toggle" id="m-toggle" data-icon="pause">Pausar sincronização</button>
      <hr>
      <button type="button" role="menuitem" data-act="quit" id="m-quit" class="danger" data-icon="power">Sair do nasdrive</button>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <section class="list" id="list" aria-live="polite"></section>
  <div class="empty" id="empty" hidden>
    <div class="big" id="empty-icon"></div>
    <strong id="empty-title">Ainda não há atividade</strong>
    <span id="empty-text">Os ficheiros que enviares para a NAS ou abrires a partir dela aparecem aqui.</span>
  </div>
  <footer class="foot">
    <div class="usage"><div class="bar"><span id="bar"></span></div><small id="usage">—</small></div>
    <button class="link" id="b-open" type="button">Abrir o nasdrive</button>
  </footer>
</div>
<script>
'use strict';
const ICONS = {
  folder: '<path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>',
  gear: '<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
  ext: '<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>',
  power: '<path d="M12 3v8"/><path d="M6.3 7.2a8 8 0 1 0 11.4 0"/>',
  pause: '<path d="M9 6v12M15 6v12"/>',
  play: '<path d="M8 5.5v13l10.5-6.5z"/>',
  up: '<path d="M12 18V6"/><path d="m7 11 5-5 5 5"/>',
  down: '<path d="M12 6v12"/><path d="m7 13 5 5 5-5"/>',
  alert: '<path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5"/><path d="M12 17.3h.01"/>',
  cloudOff: '<path d="M7 18.5a4.5 4.5 0 0 1-.6-8.96 6 6 0 0 1 1.9-3.2"/><path d="M11 3.9A6 6 0 0 1 17.9 8.6a4.6 4.6 0 0 1 2.6 7.4"/><path d="M17 18.5H8"/><path d="M3 3l18 18"/>',
  history: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
};
const $ = s => document.querySelector(s);

function icon(name) {
  const span = document.createElement('span');
  span.className = 'ic';
  span.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  return span;
}

// Builds elements; text always goes in as text nodes (file names come from the NAS).
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

const nf1 = new Intl.NumberFormat('pt-PT', { maximumFractionDigits: 1 });
function size(b) {
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let v = b || 0, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return (i ? nf1.format(v) : v) + ' ' + units[i];
}
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const dateFmt = new Intl.DateTimeFormat('pt-PT', { day: 'numeric', month: 'short' });
function ago(s) {
  if (!s) return '';
  const d = Math.max(0, Date.now() / 1000 - s);
  if (d < 45) return 'agora';
  if (d < 3600) return `há ${Math.max(1, Math.round(d / 60))} min`;
  if (d < 86400) return `há ${Math.round(d / 3600)} h`;
  if (d < 172800) return 'ontem';
  return dateFmt.format(new Date(s * 1000));
}

// ---------------------------------------------------------------- token, API, desktop app

const TOKEN_KEY = 'nasdrive.token';
let token = '';
try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (_) { /* storage disabled */ }
// The desktop app opens this page as `/panel#t=TOKEN&shell=1`.
const shell = /(^|[#&])shell=1/.test(location.hash);
{
  const m = location.hash.match(/t=([0-9a-f]{32,})/i);
  if (m) {
    token = m[1];
    try { localStorage.setItem(TOKEN_KEY, token); } catch (_) { /* keep it for this page only */ }
  }
  history.replaceState(null, '', location.pathname + (shell ? '#shell=1' : ''));
}
document.body.classList.toggle('shell', shell);

class Unauthorized extends Error {}

async function api(path, body) {
  const opts = { method: body === undefined ? 'GET' : 'POST', headers: { 'x-nasdrive-token': token } };
  if (body !== undefined) {
    opts.headers['content-type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  if (res.status === 401) throw new Unauthorized('unauthorized');
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Erro ' + res.status);
  return data;
}

// The desktop app intercepts navigations to /app/... (show a window, hide the
// panel, quit). In a normal browser tab there is no app, so this returns false.
function app(action, params) {
  if (!shell) return false;
  location.href = '/app/' + action + (params ? '?' + new URLSearchParams(params) : '');
  return true;
}

function openMain(view) {
  if (!app('main', { view: view || '' })) window.open('/#/' + (view || ''), '_blank');
}

function openPath(rel) {
  api('/api/open', { path: rel }).catch(e => flash(e.message));
}

// ---------------------------------------------------------------- rendering

let S = null;        // /api/state, null when nasdrive does not answer
let T = [];          // /api/transfers
let locked = false;  // wrong or missing token
let flashMsg = '', flashUntil = 0;
let lastSig = '';

function flash(msg) {
  flashMsg = msg;
  flashUntil = Date.now() + 5000;
  render();
}

function status() {
  const active = T.filter(t => t.active > 0);
  if (locked) return ['err', 'Sem acesso'];
  if (!S) return ['err', 'O nasdrive não está a correr'];
  if (!S.configured) return ['warn', 'Falta ligar à NAS'];
  if (S.phase === 'starting') return ['busy', 'A ligar…'];
  if (S.phase === 'stopping') return ['busy', 'A parar…'];
  if (S.phase !== 'running') return ['warn', 'Sincronização em pausa'];
  if (S.info && !S.info.online) return ['warn', 'NAS inacessível · a trabalhar offline'];
  if (active.length) {
    const up = active.filter(t => t.direction === 'upload').length, down = active.length - up;
    if (up && down) return ['busy', `A sincronizar ${plural(active.length, 'ficheiro', 'ficheiros')}`];
    return ['busy', up ? `A enviar ${plural(up, 'ficheiro', 'ficheiros')}` : `A descarregar ${plural(down, 'ficheiro', 'ficheiros')}`];
  }
  if (S.info && S.info.pending_uploads) return ['busy', `${plural(S.info.pending_uploads, 'alteração', 'alterações')} por enviar`];
  return ['ok', 'Tudo atualizado'];
}

function banner() {
  // [kind, children] for the banner element.
  const b = (kind, ic, text, button, onclick) =>
    [kind, [icon(ic), h('div', null, text, button ? h('div', null, h('button', { type: 'button', onclick }, button)) : null)]];
  if (Date.now() < flashUntil) return b('err', 'alert', flashMsg);
  if (locked) return b('err', 'alert', 'Este painel não tem acesso ao nasdrive. Abre-o a partir da app nasdrive.');
  if (!S) return b('err', 'alert', 'O nasdrive não está a responder.', 'Tentar de novo', () => { if (!app('restart')) poll(); });
  if (!S.configured) return b('info', 'gear', 'Indica o endereço da NAS para começar.', 'Configurar', () => openMain('definicoes'));
  if (S.error) return b('err', 'alert', S.error);
  if (S.phase === 'stopped') return b('info', 'pause', 'A pasta da NAS não está montada.', 'Retomar', () => act('/api/mount'));
  const errs = S.info ? S.info.errors.length : 0;
  if (errs) return b('warn', 'alert', `${plural(errs, 'ficheiro tem', 'ficheiros têm')} problemas a sincronizar.`, 'Ver', () => openMain(''));
  return null;
}

const KINDS = {
  img: 'JPG JPEG PNG GIF HEIC HEIF WEBP TIFF TIF BMP SVG RAW CR2 CR3 NEF ARW DNG',
  vid: 'MP4 MKV MOV AVI WEBM M4V MPG MPEG WMV',
  aud: 'MP3 FLAC WAV M4A AAC OGG OPUS AIFF',
  doc: 'PDF DOC DOCX ODT TXT MD RTF PAGE XLS XLSX CSV ODS NUMB PPT PPTX ODP KEY EPUB',
  zip: 'ZIP RAR 7Z TAR GZ BZ2 XZ DMG ISO',
  code: 'JS TS RS PY GO JAVA C CPP H JSON HTML CSS SH YML YAML TOML XML',
};
function kindOf(ext) {
  for (const [k, list] of Object.entries(KINDS)) if (list.split(' ').includes(ext)) return k;
  return '';
}

function item(t) {
  const name = t.path.split('/').pop();
  const ext = name.includes('.') ? name.split('.').pop().slice(0, 4).toUpperCase() : '';
  const up = t.direction === 'upload';
  const dir = t.error ? 'err' : up ? 'up' : 'down';
  const fi = h('div', { class: 'fi ' + kindOf(ext) }, ext || '···', h('span', { class: 'dir ' + dir }, icon(t.error ? 'alert' : up ? 'up' : 'down')));
  let sub, cls = 'sub';
  if (t.active > 0) sub = up ? `A enviar · ${size(t.total)}` : `A descarregar · ${size(t.bytes)} de ${size(t.total)}`;
  else if (t.error) { cls += ' err'; sub = (up ? 'Não foi enviado: ' : 'Não foi descarregado: ') + t.error; }
  else if (up) sub = `Enviado · ${ago(t.finished)} · ${size(t.total)}`;
  else sub = `Descarregado · ${ago(t.finished)} · ` + (t.bytes >= t.total ? size(t.total) : `${size(t.bytes)} de ${size(t.total)}`);
  const meta = h('div', { class: 'meta' }, h('div', { class: 'name', title: t.path }, name), h('div', { class: cls, title: sub }, sub));
  if (t.active > 0) {
    const pct = t.total ? Math.min(100, (100 * t.bytes) / t.total) : 0;
    meta.append(h('div', { class: 'prog' + (up ? ' indet' : '') }, h('span', { style: `width:${pct.toFixed(1)}%` })));
  }
  const folder = t.path.includes('/') ? t.path.slice(0, t.path.lastIndexOf('/')) : '';
  const loc = h('button', { class: 'ib sm', type: 'button', title: 'Mostrar na pasta', 'aria-label': 'Mostrar na pasta', onclick: ev => { ev.stopPropagation(); openPath(folder); } }, icon('folder'));
  return h('div', { class: 'item', title: 'Abrir ' + name, onclick: () => openPath(t.path) }, fi, meta, loc);
}

function render() {
  const [kind, text] = status();
  $('#dot').className = 'dot ' + kind;
  $('#status').textContent = text;

  const bn = banner(), el = $('#banner');
  el.hidden = !bn;
  if (bn) { el.className = 'banner ' + bn[0]; el.replaceChildren(...bn[1]); }

  const running = !!S && S.phase === 'running';
  $('#b-folder').disabled = !running;
  const tg = $('#m-toggle');
  tg.disabled = !S || !S.configured || S.phase === 'starting' || S.phase === 'stopping';
  tg.replaceChildren(icon(running ? 'pause' : 'play'), running ? 'Pausar sincronização' : 'Retomar sincronização');

  const info = S && S.info;
  if (info && info.cache_max != null) {
    $('#bar').style.width = Math.min(100, (100 * info.cache_bytes) / Math.max(1, info.cache_max)).toFixed(1) + '%';
    $('#usage').textContent = `${size(info.cache_bytes)} de ${size(info.cache_max)} neste computador`;
  } else {
    $('#bar').style.width = '0';
    $('#usage').textContent = info ? 'O Windows gere o espaço destes ficheiros' : '—';
  }

  // Only rebuild the list when something changed (keeps hover and scroll steady).
  const sig = JSON.stringify(T) + '|' + Math.floor(Date.now() / 30000);
  if (sig === lastSig) return;
  lastSig = sig;
  const list = $('#list'), empty = $('#empty');
  const active = T.filter(t => t.active > 0), recent = T.filter(t => t.active === 0).slice(0, 40);
  empty.hidden = T.length > 0;
  list.hidden = T.length === 0;
  if (!T.length) {
    const offline = S && S.info && !S.info.online;
    $('#empty-icon').replaceChildren(icon(offline ? 'cloudOff' : 'history'));
    $('#empty-title').textContent = offline ? 'Sem ligação à NAS' : 'Ainda não há atividade';
    $('#empty-text').textContent = offline
      ? 'Continuas a ter o que já está neste computador. O que alterares é enviado quando a NAS voltar.'
      : 'Os ficheiros que enviares para a NAS ou abrires a partir dela aparecem aqui.';
    list.replaceChildren();
    return;
  }
  list.replaceChildren(...[
    active.length ? h('h3', null, 'Em curso') : null,
    ...active.map(item),
    recent.length ? h('h3', null, 'Recentes') : null,
    ...recent.map(item),
  ].filter(Boolean));
}

async function act(path) {
  try { await api(path, {}); } catch (e) { flash(e.message); }
  burst();
}

let timer = 0;
async function poll() {
  clearTimeout(timer);
  try {
    const [s, t] = await Promise.all([api('/api/state'), api('/api/transfers')]);
    S = s; T = t.transfers || []; locked = false;
  } catch (e) {
    S = null; T = []; locked = e instanceof Unauthorized;
  }
  render();
  // Quick while visible, slow while the panel is hidden.
  timer = setTimeout(poll, document.visibilityState === 'visible' ? 1500 : 10000);
}

// Polls fast for a few seconds after an action, so its effect shows at once.
function burst() {
  let n = 0;
  const t = setInterval(() => { poll(); if (++n >= 10) clearInterval(t); }, 400);
}

// ---------------------------------------------------------------- events

document.querySelectorAll('[data-icon]').forEach(el => el.prepend(icon(el.dataset.icon)));
$('#b-folder').append(icon('folder'));
$('#b-menu').append(icon('gear'));

const menu = $('#menu');
let quitArmed = 0;
function closeMenu() {
  menu.hidden = true;
  quitArmed = 0;
  $('#m-quit').replaceChildren(icon('power'), 'Sair do nasdrive');
}
$('#b-menu').addEventListener('click', ev => { ev.stopPropagation(); if (menu.hidden) menu.hidden = false; else closeMenu(); });
document.addEventListener('click', ev => { if (!menu.hidden && !menu.contains(ev.target)) closeMenu(); });
menu.addEventListener('click', ev => {
  const btn = ev.target.closest('button[data-act]');
  if (!btn || btn.disabled) return;
  const a = btn.dataset.act;
  if (a === 'quit') {
    // Second click confirms (no dialogs: they do not work the same in every webview).
    if (!quitArmed) { quitArmed = Date.now(); btn.replaceChildren(icon('power'), 'Clica outra vez para sair'); return; }
    closeMenu();
    if (!app('quit')) act('/api/quit');
    return;
  }
  closeMenu();
  if (a === 'main') openMain('');
  else if (a === 'settings') openMain('definicoes');
  else if (a === 'toggle') act(S && S.phase === 'running' ? '/api/unmount' : '/api/mount');
});
$('#b-folder').addEventListener('click', () => openPath(''));
$('#b-open').addEventListener('click', () => openMain(''));
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (!menu.hidden) closeMenu(); else app('hide');
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });

poll();
</script>
</body>
</html>
