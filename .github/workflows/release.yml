name: Release

# Builds the macOS .dmg and the Windows zip (the tray app, nasyncloud-desktop.exe,
# plus the nasyncloud.exe service it runs), after the tests.
# - Pushing a tag v* (equal to the version in Cargo.toml, e.g. v0.2.1) also
#   publishes them in a GitHub Release.
# - "Run workflow" by hand only builds them; they stay as run artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    env:
      # macFUSE installs libfuse and its .pc files under /usr/local.
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "::error::the tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"; exit 1; }
      - name: Install macFUSE (only to link against its libfuse)
        run: brew install --cask macfuse
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Build NASYNCLOUD.app and the .dmg
        run: tools/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked -p nasyncloud -p nasyncloud-desktop
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force dist/pkg | Out-Null
          Copy-Item target/release/nasyncloud-desktop.exe dist/pkg/
          Copy-Item target/release/nasyncloud.exe dist/pkg/
          Copy-Item packaging/windows/LEIA-ME.txt dist/pkg/
          Compress-Archive -Path dist/pkg/* -DestinationPath "dist/NASYNCLOUD-$version-windows-x86_64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "NASYNCLOUD $GITHUB_REF_NAME" --generate-notes
